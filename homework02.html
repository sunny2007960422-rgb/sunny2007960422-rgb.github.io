<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>表格 × 圖片練習 - 課堂作業</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background: #f4f4f4; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 1rem; text-align: left; vertical-align: top; }
    th { background: #0078d7; color: #fff; }
    .caption { font-size: 0.9em; color: #666; margin-top: 0.5em; }
  </style>
</head>
<body>
  <!-- 返回按鈕 -->
  <div class="w3-container w3-padding-16 w3-white">
    <a href="index.html" class="w3-button w3-light-grey">← 返回作品集</a>
  </div>

  <div class="w3-container w3-padding-large" style="max-width: 1000px; margin: auto; background: #fff; margin-top: 1rem; border-radius: 8px;">
    <h1 style="color: #0078d7;">表格 × 圖片練習</h1>
    <p style="color: #888;">10/07 課堂作業</p>
    
    <h2>旅行相片一覽</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>分類</th>
            <th>縮圖</th>
            <th>標題與描述</th>
            <th>拍攝日期</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td rowspan="2">城市風景</td>
            <td style="text-align: center;">
              <img src="picture3.jpg" alt="傍晚的河岸與城市天際線倒影" style="width: 100%; max-width: 300px; margin-bottom: 0.5rem; border-radius: 4px;">
              <div class="caption">建議寬度 480px</div>
            </td>
            <td><strong>河畔夕照</strong><br>金色陽光灑在河面，倒映城市天際線。</td>
            <td>2025-09-01</td>
          </tr>
          <tr>
            <td style="text-align: center;">
              <img src="picture5.jpg" alt="夜晚燈光點綴的街道與咖啡店" style="width: 100%; max-width: 300px; margin-bottom: 0.5rem; border-radius: 4px;">
              <div class="caption">圖片下方加入描述</div>
            </td>
            <td><strong>夜色小徑</strong><br>街角咖啡店透出溫暖光暈。</td>
            <td>2025-09-02</td>
          </tr>
          <tr>
            <td colspan="4" style="text-align: center; background: #f0f0f0;"><strong>海邊旅行</strong></td>
          </tr>
          <tr>
            <td>自然風景</td>
            <td style="text-align: center;">
              <img src="picture4.jpg" alt="沙灘、海浪與遠方的帆船" style="width: 100%; max-width: 300px; margin-bottom: 0.5rem; border-radius: 4px;">
              <div class="caption">替代文字說明畫面重點</div>
            </td>
            <td><strong>清晨海浪</strong><br>第一道陽光照亮浪花與沙粒。</td>
            <td>2025-09-03</td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer style="text-align: center; color: #888; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #eee;">
      <p>© 2025 江婞安的課堂作業</p>
    </footer>
  </div>
</body>
</html>
